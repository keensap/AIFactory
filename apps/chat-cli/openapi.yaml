  /api/agents/{agentId}:
    parameters:
      - {name: agentId, in: path, required: true, schema: {type: string}, description: UUID or name}
    get:
      tags: [agents]
      summary: One agent
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: {$ref: '#/components/schemas/Agent'}
        '404':
          description: AGENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [agents]
      summary: Update an agent (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: {$ref: '#/components/schemas/Agent'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: AGENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [agents]
      summary: Delete an agent and its assignments (admin)
      responses:
        '204': {description: Deleted}
        '404':
          description: AGENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agents/{agentId}/test:
    post:
      tags: [agents]
      summary: Verify the agent's composition (admin)
      description: Offline by default - a local stand-in endpoint with no credentials, asserting the request the harness made. mode=online uses the real model.
      parameters:
        - {name: agentId, in: path, required: true, schema: {type: string}}
        - {name: mode, in: query, required: false, schema: {type: string, enum: [offline, online]}}
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentProbe'}
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: AGENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AGENT_PROBE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stages/{stage}/assignments:
    get:
      tags: [agents]
      summary: Resolved agent assignments for a stage's processes
      parameters:
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
        - {name: projectId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Assignments with their source
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  assignments:
                    type: array
                    items: {$ref: '#/components/schemas/AgentAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/stages/{stage}/assignments/{process}:
    parameters:
      - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      - {name: process, in: path, required: true, schema: {type: string}}
    put:
      tags: [agents]
      summary: Assign an agent to a process (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: {type: string}
                projectId: {type: string, format: uuid, description: Omit for the Factory default}
      responses:
        '200':
          description: Assignments after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: {$ref: '#/components/schemas/AgentAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [agents]
      summary: Clear an assignment (admin)
      parameters:
        - {name: projectId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Assignments after clearing
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: {$ref: '#/components/schemas/AgentAssignment'}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/stages:
    get:
      tags: [stage-runs]
      summary: Stage catalogue with prerequisites
      responses:
        '200':
          description: Every stage and what it needs
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items: {$ref: '#/components/schemas/StagePrerequisite'}
        '503':
          description: PREREQUISITES_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/stages/{stage}/readiness:
    get:
      tags: [stage-runs]
      summary: What a stage needs, and what is already present
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      responses:
        '200':
          description: Readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageReadiness'}
        '400':
          description: INVALID_STAGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PREREQUISITES_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/stages/{stage}/waivers:
    post:
      tags: [stage-runs]
      summary: Waive a prerequisite with a reason (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, reason]
              properties:
                key: {type: string}
                reason: {type: string, minLength: 3}
      responses:
        '200':
          description: Readiness after the waiver
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageReadiness'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PREREQUISITE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/stages/{stage}/waivers/{key}:
    delete:
      tags: [stage-runs]
      summary: Remove a waiver (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Readiness after removal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageReadiness'}
        '404':
          description: WAIVER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/stages/{stage}/settings:
    get:
      tags: [stage-runs]
      summary: Effective settings for a project stage
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      responses:
        '200':
          description: Settings with their source
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
                  source: {type: string, enum: [project, factory, defaults]}
        '501':
          description: STAGE_SETTINGS_NOT_IMPLEMENTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [stage-runs]
      summary: Set a project override (alias of PATCH)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanningStageSettings'}
      responses:
        '200':
          description: Effective settings after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
                  source: {type: string, enum: [project, factory, defaults]}
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags: [stage-runs]
      summary: Set a project override
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanningStageSettings'}
      responses:
        '200':
          description: Effective settings after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
                  source: {type: string, enum: [project, factory, defaults]}
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [stage-runs]
      summary: Clear the project override (fall back to the Factory default)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      responses:
        '200':
          description: Effective settings after clearing
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
                  source: {type: string, enum: [project, factory, defaults]}

  /api/stage-runs/{runId}/export:
    post:
      tags: [stage-runs]
      summary: Re-render the stage deliverable PDF
      description: Writes <project-root>/documents/<stage>/<Document Title> — <Project Name>.pdf, overwriting the canonical file.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Where the PDF was written
          content:
            application/json:
              schema:
                type: object
                properties:
                  export:
                    type: object
                    properties:
                      path: {type: string, description: Relative to the project root}
                      bytes: {type: integer}
                      documentId: {type: string, format: uuid}
        '404':
          description: STAGE_RUN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: DOCUMENT_NOT_READY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: PDF_EXPORT_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stage-runs/{runId}/telemetry:
    get:
      tags: [stage-runs]
      summary: Live run telemetry for a status bar
      description: Folded from the run's stored events using the same logic as the SSE stream. Null fields mean the figure cannot be computed yet, never zero.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Telemetry snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  telemetry: {$ref: '#/components/schemas/RunTelemetry'}
        '404':
          description: STAGE_RUN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: STAGE_RUNTIME_DISABLED or WORKSPACE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stage-runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [stage-runs]
      summary: Read persisted stage-run events
      parameters:
        - name: after
          in: query
          required: false
          description: Return events with an id greater than this value.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Ordered events
          content:
            application/json:
              schema:
                type: object
                required: [events, nextAfter]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageRunEvent'
                  nextAfter:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stage-runs/{runId}/events/stream:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [stage-runs]
      summary: Stream stage-run events over SSE
      description: |
        Replays persisted events after the `after` query or Last-Event-ID header,
        then tails new events. The stream ends after a terminal run event.
        Browsers should use fetch + ReadableStream so the bearer token can be sent.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stage-runs/{runId}/execute:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [stage-runs]
      summary: Start the analyzer, author and reviewer loop
      parameters:
        - name: wait
          in: query
          required: false
          description: Wait for completion instead of returning 202 immediately.
          schema:
            type: boolean
      responses:
        '200':
          description: Run advanced to awaiting_human (wait=1)
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: '#/components/schemas/StageRunDetail'
        '202':
          description: Execution started; poll the run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: '#/components/schemas/StageRunDetail'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/HarnessError'

  /api/stage-runs/{runId}/decision:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [stage-runs]
      summary: Record the human go/no-go decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [go, conditional_go, no_go]
                note:
                  type: string
      responses:
        '200':
          description: Completed stage run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: '#/components/schemas/StageRunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/chat:
    post:
      tags: [chat]
      summary: Run one non-streaming turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Busy'
        '413':
          $ref: '#/components/responses/TooLarge'
        '502':
          $ref: '#/components/responses/HarnessError'
        '503':
          $ref: '#/components/responses/HarnessUnavailable'
        '504':
          $ref: '#/components/responses/HarnessTimeout'

  /api/chat/stream:
    post:
      tags: [chat]
      summary: Run one turn and stream Server-Sent Events
      description: |
        Event names: session, status, text, thinking (only with
        --show-thinking), tool_call, tool_result, final, done, error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE frames.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Busy'
        '413':
          $ref: '#/components/responses/TooLarge'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when AIFACTORY_API_TOKEN is configured.

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [session-53dedc16-56c1-4f0e-b076-b7a799b75933]
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Stage:
      name: stage
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProjectStage'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 65536
        sessionId:
          type: string
          description: Omit to start a new conversation.
        projectId:
          type: string
          format: uuid
          description: >-
            Run the turn in this registry project's rootPath. Binds a new session
            to the project; a continued session always uses its bound project and
            a different projectId is rejected with 409 SESSION_PROJECT_MISMATCH.
            Archived projects cannot start new sessions (409 PROJECT_ARCHIVED).
            Requires DATABASE_URL (503 DATABASE_NOT_CONFIGURED otherwise).
    ChatResponse:
      type: object
      required: [sessionId, reply, reason, durationMs]
      properties:
        sessionId:
          type: string
        reply:
          type: string
        reason:
          $ref: '#/components/schemas/TurnReason'
        durationMs:
          type: integer
    TurnReason:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
          additionalProperties: true
        - type: 'null'
    Message:
      type: object
      required: [role, content, at]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        at:
          type: string
          format: date-time
    SessionSummary:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        projectId:
          type: string
          format: uuid
          description: Present when the session was started with a projectId.
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
    ToolDescriptor:
      type: object
      required: [name, description, inputSchema]
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
    PdfReviewDocument:
      type: object
      required: [filename, pages, characters, truncated]
      properties:
        filename:
          type: string
        pages:
          type: integer
        characters:
          type: integer
        truncated:
          type: boolean
    PdfReviewAnalysis:
      oneOf:
        - type: object
          required: [type, decision, markdown, questions]
          properties:
            type:
              const: review
            decision:
              type: string
              enum: [complete, needs_revision]
            markdown:
              type: string
            questions:
              type: array
              items:
                type: string
        - type: object
          required: [type, decision, questions, markdown]
          properties:
            type:
              const: questions
            decision:
              const: questions_required
            questions:
              type: array
              items:
                type: string
            markdown:
              type: string
    PdfReviewResult:
      type: object
      required: [project, sessionId, document, analysis, durationMs]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        sessionId:
          type: string
        document:
          $ref: '#/components/schemas/PdfReviewDocument'
        analysis:
          $ref: '#/components/schemas/PdfReviewAnalysis'
        durationMs:
          type: integer
    ProjectStatus:
      type: string
      enum: [active, inactive, archived, completed, on_hold]
    Settings:
      type: object
      required: [maxActiveProjects, updatedAt]
      properties:
        maxActiveProjects:
          type: integer
          minimum: 1
          maximum: 1000
          default: 3
        updatedAt:
          type: string
          format: date-time
    SettingsPatch:
      type: object
      required: [maxActiveProjects]
      properties:
        maxActiveProjects:
          type: integer
          minimum: 1
          maximum: 1000
    SettingsResponse:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
    SdlcStage:
      type: object
      required: [key, name, position]
      properties:
        key:
          type: string
        name:
          type: string
        position:
          type: integer
    LogLevel:
      type: string
      enum: [trace, debug, info, warn, error, fatal]
    AppLog:
      type: object
      required: [id, ts, level, message, record]
      properties:
        id: {type: string}
        ts: {type: string, format: date-time}
        level: {$ref: '#/components/schemas/LogLevel'}
        event: {type: [string, 'null']}
        component: {type: [string, 'null']}
        message: {type: string}
        requestId: {type: [string, 'null']}
        traceId: {type: [string, 'null']}
        projectId: {type: [string, 'null']}
        stageRunId: {type: [string, 'null']}
        stage: {type: [string, 'null']}
        role: {type: [string, 'null']}
        record: {type: object, additionalProperties: true}
    LoggingSettings:
      type: object
      properties:
        level:
          oneOf:
            - $ref: '#/components/schemas/LogLevel'
            - type: 'null'
        postgres:
          type: object
          properties:
            enabled: {type: boolean}
            minLevel: {$ref: '#/components/schemas/LogLevel'}
            retentionDays: {type: integer, minimum: 1, maximum: 365}
        file:
          type: object
          properties:
            retentionDays: {type: integer, minimum: 0, maximum: 365}
        updatedAt: {type: [string, 'null'], format: date-time}
    LoggingSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        level:
          oneOf:
            - $ref: '#/components/schemas/LogLevel'
            - type: 'null'
        postgres:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            minLevel: {$ref: '#/components/schemas/LogLevel'}
            retentionDays: {type: integer, minimum: 1, maximum: 365}
        file:
          type: object
          additionalProperties: false
          properties:
            retentionDays: {type: integer, minimum: 0, maximum: 365}
    LoggingSettingsResponse:
      type: object
      properties:
        settings: {$ref: '#/components/schemas/LoggingSettings'}
        postgresAvailable: {type: boolean}
    TokenTotals:
      type: object
      required: [input, output, total, cacheRead, cacheWrite]
      properties:
        input: {type: integer}
        output: {type: integer}
        total: {type: integer}
        cacheRead: {type: integer}
        cacheWrite: {type: integer}
    DurationStats:
      type: object
      required: [count, totalMs, avgMs, p50Ms, p95Ms, maxMs]
      properties:
        count: {type: integer}
        totalMs: {type: integer}
        avgMs: {type: integer}
        p50Ms: {type: integer}
        p95Ms: {type: integer}
        maxMs: {type: integer}
    ModelProvider:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [anthropic, openai, openai-compatible, azure-openai, google, bedrock]}
        displayName: {type: string}
        baseUrl: {type: [string, 'null']}
        apiKeyEnv: {type: [string, 'null']}
        local: {type: boolean}
        enabled: {type: boolean}
        credentialPresent: {type: boolean}
        modelCount: {type: integer}
    ModelEntry:
      type: object
      properties:
        provider: {type: string}
        model: {type: string}
        displayName: {type: [string, 'null']}
        contextWindow: {type: [integer, 'null']}
        maxOutput: {type: [integer, 'null']}
        capabilities: {type: object, additionalProperties: true}
        price: {type: object, additionalProperties: true}
        discoveredAt: {type: [string, 'null'], format: date-time}
    ModelTarget:
      type: object
      required: [provider, model]
      properties:
        provider: {type: string}
        model: {type: string}
        temperature: {type: number, minimum: 0, maximum: 2}
        maxTokens: {type: integer, minimum: 1, maximum: 200000}
        reasoningEffort: {type: string}
        fallback:
          type: array
          maxItems: 4
          items:
            type: object
            required: [provider, model]
            properties:
              provider: {type: string}
              model: {type: string}
    ModelTargetView:
      type: object
      properties:
        target:
          oneOf:
            - $ref: '#/components/schemas/ModelTarget'
            - type: 'null'
        source: {type: string, enum: [settings, environment, unconfigured]}
        warnings:
          type: array
          items: {type: string}
        updatedAt: {type: [string, 'null'], format: date-time}
        providers:
          type: array
          items: {$ref: '#/components/schemas/ModelProvider'}
    StageAttachment:
      type: object
      description: A requester-supplied PDF input; text is extracted once at upload.
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        stage: {$ref: '#/components/schemas/ProjectStage'}
        kind: {type: string, enum: [input]}
        title: {type: string}
        filename: {type: string}
        storagePath: {type: string, description: Relative to the project root, under .aifactory}
        textPath: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer}
        sha256: {type: string}
        pages: {type: integer}
        characters: {type: integer}
        truncated: {type: boolean}
        createdAt: {type: string, format: date-time}
    CostSummary:
      type: object
      description: usd is null when nothing was priced; unpricedTokens > 0 means the figure is partial.
      properties:
        usd: {type: [number, 'null']}
        pricedTokens: {type: integer}
        unpricedTokens: {type: integer}
    AgentInput:
      type: object
      required: [name]
      properties:
        name: {type: string, description: lower-case words joined by hyphens}
        description: {type: string}
        persona: {type: string, maxLength: 8000, description: Replaces the deployment persona for this process}
        model: {type: [string, 'null'], description: A model inside the Factory provider only}
        reasoningEffort: {type: [string, 'null']}
        tools:
          type: array
          items: {type: string}
          description: Harness tool ids the agent may use; empty means no restriction
        skills:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, instructions]
            properties:
              name: {type: string}
              description: {type: string}
              instructions: {type: string}
        enabled: {type: boolean}
    Agent:
      allOf:
        - $ref: '#/components/schemas/AgentInput'
        - type: object
          properties:
            id: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    AgentProbe:
      type: object
      properties:
        ok: {type: boolean, description: True only when every check passed}
        configAccepted: {type: boolean}
        checks:
          type: array
          description: Offline mode only.
          items:
            type: object
            properties:
              name: {type: string, description: 'composition | request | persona | model | skill:<name> | tools'}
              ok: {type: boolean}
              detail: {type: string}
        config:
          type: object
          properties:
            persona: {type: boolean}
            model: {type: [string, 'null']}
            tools: {type: integer}
            skills:
              type: array
              items: {type: string}
            patchRows: {type: integer}
        request:
          type: object
          description: What the harness actually sent (offline mode).
          properties:
            model: {type: [string, 'null']}
            tools: {type: integer}
            toolNames:
              type: array
              items: {type: string}
        model:
          type: object
          properties:
            ok: {type: boolean}
            reply: {type: string}
            code: {type: string, enum: [MODEL_CALL_FAILED, MODEL_NOT_CONFIGURED, COMPOSITION_REJECTED]}
            message: {type: string}
    AgentAssignment:
      type: object
      properties:
        process: {type: string}
        agent:
          oneOf:
            - $ref: '#/components/schemas/Agent'
            - type: 'null'
        source: {type: string, enum: [project, factory, none]}
    StagePrerequisite:
      type: object
      properties:
        stage: {$ref: '#/components/schemas/ProjectStage'}
        stageLabel: {type: string}
        key: {type: string}
        label: {type: string}
        description: {type: string}
        required: {type: boolean}
        accepts:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [brief, attachment, document]}
              label: {type: string}
              min: {type: integer}
              documentKinds:
                type: array
                items: {type: string}
    PrerequisiteStatus:
      allOf:
        - $ref: '#/components/schemas/StagePrerequisite'
        - type: object
          properties:
            satisfied: {type: boolean}
            via: {type: [string, 'null'], enum: [brief, attachment, document, waiver, null]}
            detail: {type: [string, 'null']}
    StageReadiness:
      type: object
      properties:
        projectId: {type: string, format: uuid}
        stage: {$ref: '#/components/schemas/ProjectStage'}
        ready: {type: boolean}
        prerequisites:
          type: array
          items: {$ref: '#/components/schemas/PrerequisiteStatus'}
        missing:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              label: {type: string}
              accepts:
                type: array
                items: {type: string}
    PlanningStageSettings:
      type: object
      properties:
        gateAfterEachReview: {type: boolean, description: Pause after every review and ask before applying its changes}
        maxReviewCycles: {type: integer, minimum: 1, maximum: 10, description: Autonomous write/review cycles when gating is off, counted after the first review}
        minRating: {type: integer, minimum: 0, maximum: 100, description: Minimum overall rating for the run to stop revising early}
        maxBlockers: {type: integer, minimum: 0, maximum: 20, description: Blockers tolerated before revising again}
        maxMajor: {type: integer, minimum: 0, maximum: 50, description: Major findings tolerated before revising again}
    ResolvedStageSettings:
      type: object
      properties:
        stage: {$ref: '#/components/schemas/ProjectStage'}
        settings:
          type: object
          additionalProperties: true
          description: Heterogeneous per stage; planning carries gate, cycle and acceptance fields.
        source: {type: string, enum: [project, factory, defaults]}
    PendingGate:
      type: object
      description: The question a paused run is waiting on. The draft is in run.draftMarkdown; no document or PDF exists yet.
      properties:
        kind: {type: string, enum: [review_changes, final]}
        question: {type: string}
        cycle: {type: integer, description: Revision cycles completed when the gate was raised}
        maxReviewCycles: {type: integer}
        gateAfterEachReview: {type: boolean}
        reviewDecision: {type: string, enum: [approved, needs_revision, rejected]}
        findings:
          type: array
          items: {type: object, additionalProperties: true}
        rating: {type: [number, 'null'], description: Overall document rating 0-100, null when the reviewer did not rate}
        counts:
          type: object
          properties:
            blockers: {type: integer}
            major: {type: integer}
            minor: {type: integer}
        accepted: {type: boolean, description: Whether the review met the acceptance criteria}
        criteria:
          type: object
          properties:
            minRating: {type: integer}
            maxBlockers: {type: integer}
            maxMajor: {type: integer}
        waitingSince: {type: string, format: date-time}
    RunTelemetry:
      type: object
      description: Everything a run status bar shows. Null means "cannot be computed", never zero.
      properties:
        turns: {type: integer, description: Highest turn number seen}
        steps: {type: integer, description: Completed steps}
        phase: {type: [string, 'null']}
        usage: {$ref: '#/components/schemas/TelemetryUsage'}
        lastStep:
          allOf:
            - $ref: '#/components/schemas/TelemetryUsage'
            - type: object
              properties:
                durationMs: {type: [integer, 'null']}
                tokensPerSecond: {type: [number, 'null']}
        tokensPerSecond: {type: [number, 'null'], description: Output tokens per second of the last step}
        averageTokensPerSecond: {type: [number, 'null']}
        cacheHitPercent: {type: [number, 'null'], description: cacheRead / (input + cacheRead + cacheWrite) * 100}
        contextUsedTokens: {type: [integer, 'null'], description: Prompt tokens of the last step}
        contextWindow: {type: [integer, 'null']}
        contextUsedPercent: {type: [number, 'null']}
        model:
          oneOf:
            - type: object
              properties:
                provider: {type: string}
                model: {type: string}
            - type: 'null'
        startedAt: {type: [string, 'null'], format: date-time}
        updatedAt: {type: [string, 'null'], format: date-time}
    TelemetryUsage:
      type: object
      properties:
        input: {type: integer, description: Excludes cached tokens}
        output: {type: integer}
        total: {type: integer, description: Includes cache read and write}
        cacheRead: {type: integer}
        cacheWrite: {type: integer}
    ModelUsageRow:
      type: object
      description: provider and model are both null for usage recorded before model attribution existed (unattributed).
      properties:
        provider: {type: [string, 'null']}
        model: {type: [string, 'null']}
        tokens: {$ref: '#/components/schemas/TokenTotals'}
        calls: {type: integer, description: Number of usage events}
        pricedCalls: {type: integer}
        costUsd: {type: [number, 'null'], description: null = unknown (no price); 0 = priced and free}
        unpricedTokens: {type: integer}
        runs: {type: integer}
    FactoryUsage:
      type: object
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        tokens: {$ref: '#/components/schemas/TokenTotals'}
        cost: {$ref: '#/components/schemas/CostSummary'}
        byModel:
          type: array
          items: {$ref: '#/components/schemas/ModelUsageRow'}
        byProject:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              projectId: {type: string}
              name: {type: [string, 'null']}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              calls: {type: integer}
              runs: {type: integer}
              costUsd: {type: [number, 'null']}
              unpricedTokens: {type: integer}
        daily:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              calls: {type: integer}
              costUsd: {type: [number, 'null']}
              unpricedTokens: {type: integer}
    ProviderBreaker:
      type: object
      properties:
        provider: {type: string}
        breaker:
          type: object
          properties:
            state: {type: string, enum: [closed, open, half_open]}
            consecutiveFailures: {type: integer}
            openedAt: {type: [integer, 'null'], description: epoch milliseconds}
            retryAt: {type: [integer, 'null'], description: epoch milliseconds}
            lastError: {type: [string, 'null']}
            successes: {type: integer}
            failures: {type: integer}
    ModelUsage:
      type: object
      description: inputTokens excludes cached tokens; totalTokens includes cache read and write.
      properties:
        inputTokens: {type: integer}
        outputTokens: {type: integer}
        totalTokens: {type: integer}
        cacheReadTokens: {type: integer}
        cacheWriteTokens: {type: integer}
    ModelAttempt:
      type: object
      properties:
        provider: {type: string}
        model: {type: string}
        position: {type: integer, description: 0 for the primary target, 1.. for fallbacks}
        outcome: {type: string, enum: [ok, error, skipped]}
        durationMs: {type: integer}
        kind:
          type: string
          enum: [auth, quota, rate_limit, overloaded, timeout, network, invalid_request, context_overflow, content_filter, unsupported, aborted, unavailable, unconfigured, unknown]
        status: {type: integer}
        message: {type: string}
        usage: {$ref: '#/components/schemas/ModelUsage'}
        costUsd: {type: number}
    ModelTestResult:
      type: object
      properties:
        provider: {type: string}
        model: {type: string}
        text: {type: string, description: Truncated to 500 characters}
        truncated: {type: boolean}
        finishReason: {type: string, enum: [stop, tool_calls, length, content_filter, error]}
        usage: {$ref: '#/components/schemas/ModelUsage'}
        costUsd: {type: [number, 'null'], description: null when the model has no price}
        durationMs: {type: integer}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/ModelAttempt'}
    ProviderHealth:
      type: object
      properties:
        provider: {type: string}
        state: {type: string, enum: [healthy, degraded, unconfigured]}
        credential: {type: boolean}
        reachable: {type: [boolean, 'null']}
        latencyMs: {type: [integer, 'null']}
        models: {type: integer}
        lastError: {type: [string, 'null']}
    ObservabilityHealth:
      type: object
      required: [provider, enabled, state, projects, exports, failures, droppedSpans]
      properties:
        provider: {type: string}
        enabled: {type: boolean}
        state:
          type: string
          enum: [healthy, degraded, open, disabled]
        projects: {type: integer}
        exports: {type: integer}
        failures: {type: integer}
        droppedSpans: {type: integer}
        lastError: {type: [string, 'null']}
        openUntil: {type: [string, 'null'], format: date-time}
        cache:
          type: object
          properties:
            entries: {type: integer}
            hits: {type: integer}
            misses: {type: integer}
            timeouts: {type: integer}
            ttlMs: {type: integer}
            deadlineMs: {type: integer}
    ProjectStats:
      type: object
      required: [projectId, from, to, runs, tokens, cost, byModel, runDurationMs, activeDurationMs, byRole, byStage, daily, recentRuns]
      properties:
        projectId: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        runs:
          type: object
          properties:
            total: {type: integer}
            byStatus:
              type: object
              additionalProperties: {type: integer}
            byStage:
              type: object
              additionalProperties: {type: integer}
        tokens: {$ref: '#/components/schemas/TokenTotals'}
        cost: {$ref: '#/components/schemas/CostSummary'}
        byModel:
          type: array
          description: Usage per provider/model, largest first. provider/model null = unattributed (recorded before model tracking).
          items: {$ref: '#/components/schemas/ModelUsageRow'}
        runDurationMs:
          allOf:
            - $ref: '#/components/schemas/DurationStats'
          description: Wall-clock run duration; may include time waiting for a human decision.
        activeDurationMs:
          allOf:
            - $ref: '#/components/schemas/DurationStats'
          description: Sum of analyzer/author/reviewer execution durations.
        byRole:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              runs: {type: integer}
              attempts: {type: integer}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              costUsd: {type: [number, 'null'], description: null = no priced usage in scope}
              durationMs: {$ref: '#/components/schemas/DurationStats'}
        byStage:
          type: array
          items:
            type: object
            properties:
              stage: {$ref: '#/components/schemas/ProjectStage'}
              runs: {type: integer}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              costUsd: {type: [number, 'null'], description: null = no priced usage in scope}
              activeDurationMs: {$ref: '#/components/schemas/DurationStats'}
        daily:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              runs: {type: integer}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              costUsd: {type: [number, 'null'], description: null = no priced usage in scope}
              activeDurationMs: {type: integer}
        recentRuns:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              stage: {$ref: '#/components/schemas/ProjectStage'}
              attempt: {type: integer}
              status: {type: string}
              startedAt: {type: [string, 'null'], format: date-time}
              endedAt: {type: [string, 'null'], format: date-time}
              durationMs: {type: [integer, 'null']}
              activeDurationMs: {type: integer}
              tokens: {$ref: '#/components/schemas/TokenTotals'}
              costUsd: {type: [number, 'null'], description: null = no priced usage in scope}
              models:
                type: array
                description: Model(s) the run used; normally one. Empty when no usage was recorded.
                items:
                  type: object
                  properties:
                    provider: {type: [string, 'null']}
                    model: {type: [string, 'null']}
              roles:
                type: array
                items: {type: string}
    ProjectLog:
      type: object
      required: [id, projectId, stageRunId, stage, attempt, type, level, message, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
          format: uuid
        stageRunId:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/ProjectStage'
        attempt:
          type: integer
        role:
          type: [string, 'null']
        agentId:
          type: [string, 'null']
        type:
          type: string
        phase:
          type: [string, 'null']
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        preview:
          type: [string, 'null']
        source:
          type: string
          enum: [events, app]
        component:
          type: [string, 'null']
        requestId:
          type: [string, 'null']
        traceId:
          type: [string, 'null']
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ObservabilitySummary:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
        projectName:
          type: string
        windowHours:
          type: integer
        traces:
          type: integer
        spans:
          type: integer
        errors:
          type: integer
        tools:
          type: integer
        tokens:
          type: integer
        latencyMs:
          type: object
          properties:
            count:
              type: integer
            avg:
              type: integer
            p50:
              type: integer
            p95:
              type: integer
            max:
              type: integer
        roles:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              spans:
                type: integer
              errors:
                type: integer
              durationMs:
                type: integer
              tokens:
                type: integer
        lastSpanAt:
          type: [string, 'null']
          format: date-time
        truncated:
          type: boolean
    IndexedDocument:
      type: object
      required: [documentId, title, chunks]
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        chunks:
          type: integer
    IndexProjectResult:
      type: object
      required: [indexed, skipped, chunks]
      properties:
        indexed:
          type: array
          items:
            $ref: '#/components/schemas/IndexedDocument'
        skipped:
          type: array
          items:
            type: object
            properties:
              documentId:
                type: string
              title:
                type: string
              reason:
                type: string
        chunks:
          type: integer
    ChunkSearchResult:
      type: object
      required: [id, projectId, sourceType, sourcePath, chunkIndex, content, score]
      properties:
        id:
          type: string
        projectId:
          type: string
          format: uuid
        documentId:
          type: [string, 'null']
        stageRunId:
          type: [string, 'null']
        sourceType:
          type: string
        sourcePath:
          type: string
        chunkIndex:
          type: integer
        content:
          type: string
        score:
          type: number
    StageRunEvent:
      type: object
      required: [id, projectId, stageRunId, type, payload, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
          format: uuid
        stageRunId:
          type: string
          format: uuid
        role:
          type: [string, 'null']
        agentId:
          type: [string, 'null']
        type:
          type: string
        phase:
          type: [string, 'null']
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    StageRun:
      type: object
      required: [id, projectId, stage, attempt, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/ProjectStage'
        attempt:
          type: integer
        sessionId:
          type: [string, 'null']
        status:
          type: string
          enum: [pending, analyzing, drafting, reviewing, revising, awaiting_human, completed, failed, cancelled]
        contextHash:
          type: [string, 'null']
        context:
          type: [object, 'null']
          additionalProperties: true
        inputText:
          type: [string, 'null']
        analysisMarkdown:
          type: [string, 'null']
        draftMarkdown:
          type: [string, 'null']
        summaryMarkdown:
          type: [string, 'null']
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        lockedBy:
          type: [string, 'null']
        leaseExpiresAt:
          type: [string, 'null']
          format: date-time
        executionAttempts:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StageReview:
      type: object
      required: [id, stageRunId, reviewerRole, decision, findings, createdAt]
      properties:
        id:
          type: string
          format: uuid
        stageRunId:
          type: string
          format: uuid
        reviewerRole:
          type: string
        decision:
          type: string
          enum: [approved, needs_revision, rejected]
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
    StageRunDetail:
      allOf:
        - $ref: '#/components/schemas/StageRun'
        - type: object
          required: [reviews, documents]
          properties:
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/StageReview'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/ProjectDocument'
    ProjectStage:
      type: string
      enum: [planning, requirements, design, architecture, development, testing, deployment, maintenance]
    StageState:
      type: object
      required: [stage, status]
      properties:
        stage:
          $ref: '#/components/schemas/ProjectStage'
        status:
          type: string
          enum: [not_started, in_progress, completed, blocked, skipped]
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/ProjectStage'
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum: [open, done, waived]
        evidenceDocumentId:
          type: [string, 'null']
          format: uuid
        completedAt:
          type: [string, 'null']
          format: date-time
    NextAction:
      type: object
      properties:
        kind:
          type: string
          enum: [checklist, advance_stage, complete_project]
        stage:
          $ref: '#/components/schemas/ProjectStage'
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
    SdlcStatus:
      type: object
      properties:
        currentStage:
          $ref: '#/components/schemas/ProjectStage'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageState'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/NextAction'
        progress:
          type: object
          properties:
            completedStages:
              type: integer
            totalStages:
              type: integer
            completedRequiredItems:
              type: integer
            totalRequiredItems:
              type: integer
    ProjectDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/ProjectStage'
        kind:
          type: string
        title:
          type: string
        storagePath:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        status:
          type: string
          enum: [uploaded, in_review, approved, rejected, superseded]
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectDetailResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        sdlc:
          $ref: '#/components/schemas/SdlcStatus'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDocument'
    ProjectBriefing:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        inputHash:
          type: string
        markdown:
          type: string
        risks:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
        model:
          type: [string, 'null']
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/NextAction'
        stale:
          type: boolean
    Project:
      type: object
      required: [id, name, rootPath, organization, ownerEmail, status, currentStage, stageUpdatedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rootPath:
          type: string
        organization:
          type: [string, 'null']
        ownerEmail:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ProjectStatus'
        currentStage:
          $ref: '#/components/schemas/ProjectStage'
        stageUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [name, rootPath]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        rootPath:
          type: string
          description: Absolute path to an existing directory; canonicalised with realpath.
        organization:
          type: [string, 'null']
        ownerEmail:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        rootPath:
          type: string
        organization:
          type: [string, 'null']
        ownerEmail:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/Project'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, status]
          properties:
            message:
              type: string
            code:
              type: string
            status:
              type: integer

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown route or local session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Busy:
      description: A turn is already running for the session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Body or message exceeds the limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Unique constraint conflict, such as a duplicate root path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatabaseUnavailable:
      description: Project registry is disabled because DATABASE_URL is not set
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HarnessError:
      description: Harness turn failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HarnessUnavailable:
      description: Harness executable could not start
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HarnessTimeout:
      description: Turn timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
