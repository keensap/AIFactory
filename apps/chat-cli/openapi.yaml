openapi: 3.1.0
info:
  title: AI Factory Chat API
  version: 0.1.0
  description: |
    Thin HTTP/JSON and SSE API over a DeepSeek Harness headless runtime.
    One request is one harness turn. The harness Session id is the public
    conversation id; the local session index exists for UI listing and history.
servers:
  - url: http://127.0.0.1:8787
    description: Default local server
security:
  - {}
  - bearerAuth: []
tags:
  - name: health
  - name: sessions
  - name: chat
  - name: stage-runs
  - name: models
  - name: stats
  - name: logs
  - name: observability
  - name: retrieval
paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness and configuration summary
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, uptimeSeconds]
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  uptimeSeconds:
                    type: integer
                  harness:
                    oneOf:
                      - type: object
                        properties:
                          command:
                            type: string
                          profile:
                            type: string
                      - type: 'null'
                  database:
                    type: string
                  pools:
                    type: object
                    description: One shared application pool plus a separate small log pool.
                    properties:
                      app:
                        type: array
                        items:
                          type: object
                          properties:
                            total: {type: integer}
                            idle: {type: integer}
                            waiting: {type: integer}
                      logs:
                        type: array
                        items:
                          type: object
                          properties:
                            total: {type: integer}
                            idle: {type: integer}
                            waiting: {type: integer}
                  schema:
                    type: object
                    description: Applied migration head.
                    properties:
                      version: {type: [string, 'null']}
                      applied: {type: integer}

  /api/sessions:
    get:
      tags: [sessions]
      summary: List locally indexed conversations
      parameters:
        - name: projectId
          in: query
          required: false
          description: Only sessions bound to this registry project.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session summaries, most recently updated first
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'

  /api/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: Get a conversation with messages
      responses:
        '200':
          description: Full local session record
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [sessions]
      summary: Delete the local session record
      description: Does not delete the harness Session or its transcript.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Busy'

  /api/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      summary: Get only the messages of a conversation
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tools:
    get:
      tags: [tools]
      summary: List agent-facing project tool descriptors
      responses:
        '200':
          description: Tool names, descriptions and JSON Schemas
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolDescriptor'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/sdlc/stages:
    get:
      tags: [sdlc]
      summary: List the default SDLC stage names
      description: |
        Reference list for UI display. Project stage state stores the stage key;
        this table is not a foreign-key parent for project_stages.
      responses:
        '200':
          description: Stages in display order
          content:
            application/json:
              schema:
                type: object
                required: [stages]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: '#/components/schemas/SdlcStage'

  /api/settings:
    get:
      tags: [settings]
      summary: View chat settings
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [settings]
      summary: Update chat settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/projects:
    get:
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: organization
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Projects, newest first
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created project with SDLC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Get one project
      responses:
        '200':
          description: Project with SDLC status and documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [projects]
      summary: Update project fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    delete:
      tags: [projects]
      summary: Remove a project
      description: Deletes the registry row only; the root directory is never removed.
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/projects/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [projects]
      summary: Change project status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/fs/directories:
    get:
      tags: [projects]
      summary: List subdirectories on the API host (directory picker)
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute path; defaults to the API host's home directory.
          schema:
            type: string
        - name: hidden
          in: query
          required: false
          description: Set to 1 to include dot-directories.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Subdirectories of the canonical path
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, home, entries, truncated]
                properties:
                  path: { type: string }
                  parent: { type: [string, 'null'] }
                  home: { type: string }
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
        '400': { description: 'INVALID_PATH or NOT_A_DIRECTORY' }
        '403': { description: PATH_NOT_READABLE }
        '404': { description: PATH_NOT_FOUND }
  /api/projects/{projectId}/sessions/{sessionId}/pdf-review:
    post:
      tags: [pdf]
      summary: Review a requirement PDF as a product manager
      description: |
        Extracts PDF text, attaches project context, runs the configured model
        and returns either a Markdown review or a list of questions.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, message]
              properties:
                file:
                  type: string
                  format: binary
                  description: Requirement PDF, maximum 20 MB.
                message:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        '200':
          description: Review or questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfReviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          description: PDF contains no extractable text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/HarnessError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/projects/{id}/stage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [projects]
      summary: Advance a project to the next SDLC stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  $ref: '#/components/schemas/ProjectStage'
      responses:
        '200':
          description: Updated project status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/projects/{id}/checklist/{stage}/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: stage
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ProjectStage'
      - name: key
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [projects]
      summary: Update a stage checklist item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, done, waived]
                evidenceDocumentId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated checklist item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/attachments:
    get:
      tags: [projects]
      summary: List stage input documents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: stage, in: query, schema: {$ref: '#/components/schemas/ProjectStage'}}
      responses:
        '200':
          description: Attachments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: {$ref: '#/components/schemas/StageAttachment'}
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [projects]
      summary: Upload one or more PDFs for stage analysis
      description: multipart/form-data. Only PDFs are accepted; images are rejected because the stage analysis consumes text only.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: {type: string, format: binary}
                stage: {type: string, description: Defaults to the project's current stage}
                title: {type: string, description: Only honoured for a single file}
      responses:
        '201':
          description: Created attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: {$ref: '#/components/schemas/StageAttachment'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: ATTACHMENT_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: UNSUPPORTED_FILE_TYPE (images, non-PDF files)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: PDF_HAS_NO_TEXT (scanned document without a text layer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/attachments/{attachmentId}/content:
    get:
      tags: [projects]
      summary: Download the original attachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The stored PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404':
          description: ATTACHMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: ATTACHMENT_CONTENT_MISSING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/attachments/{attachmentId}:
    delete:
      tags: [projects]
      summary: Delete an attachment and its stored files
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Deleted
        '404':
          description: ATTACHMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [documents]
      summary: List project documents
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectDocument'
    post:
      tags: [documents]
      summary: Upload a project document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, stage, kind]
              properties:
                file:
                  type: string
                  format: binary
                stage:
                  $ref: '#/components/schemas/ProjectStage'
                kind:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: Created document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/ProjectDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'

  /api/projects/{id}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [documents]
      summary: Get document metadata
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/ProjectDocument'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [documents]
      summary: Update document status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [uploaded, in_review, approved, rejected, superseded]
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/ProjectDocument'

  /api/projects/{id}/documents/{documentId}/export:
    get:
      tags: [projects]
      summary: Download the generated PDF for a stage document
      description: Streams the file from the project's documents/ tree. Refuses a recorded path outside that directory.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404':
          description: DOCUMENT_NOT_FOUND or DOCUMENT_NOT_EXPORTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: EXPORT_FILE_MISSING (re-export to recreate it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: EXPORT_PATH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [documents]
      summary: Download the stored document
      responses:
        '200':
          description: Binary file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/briefing:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Read the cached AI briefing
      responses:
        '200':
          description: Cached briefing
          content:
            application/json:
              schema:
                type: object
                required: [briefing]
                properties:
                  briefing:
                    $ref: '#/components/schemas/ProjectBriefing'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [projects]
      summary: Generate or refresh the AI briefing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: boolean
      responses:
        '200':
          description: Generated briefing
          content:
            application/json:
              schema:
                type: object
                required: [briefing]
                properties:
                  briefing:
                    $ref: '#/components/schemas/ProjectBriefing'
        '502':
          $ref: '#/components/responses/HarnessError'

  /api/projects/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [stats]
      summary: Token consumption and task-duration statistics
      description: >-
        Derived from the durable harness stage event log (status usage and
        role_end durations). Does not depend on Phoenix. Default window is the
        last 30 days.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: stage
          in: query
          schema: {$ref: '#/components/schemas/ProjectStage'}
        - name: role
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    $ref: '#/components/schemas/ProjectStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/projects/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [logs]
      summary: Read project logs (stage events, application logs, or both)
      parameters:
        - name: source
          in: query
          description: >-
            events (default, id cursor), app (application logs, id cursor) or
            all (merged newest-first; `before` is an ISO timestamp).
          schema:
            type: string
            enum: [events, app, all]
            default: events
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: type
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
            format: uuid
        - name: stage
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStage'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Newest-first project logs
          content:
            application/json:
              schema:
                type: object
                required: [logs, nextBefore]
                properties:
                  source:
                    type: string
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectLog'
                  nextBefore:
                    type: [string, 'null']
                  postgresEnabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Application log storage is not configured (source=app|all)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/logs:
    get:
      tags: [logs]
      summary: Query application logs (requires PostgreSQL storage)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: before, in: query, description: Numeric id cursor, schema: {type: string}}
        - {name: level, in: query, schema: {$ref: '#/components/schemas/LogLevel'}}
        - {name: minLevel, in: query, schema: {$ref: '#/components/schemas/LogLevel'}}
        - {name: event, in: query, description: Exact event, or prefix when it ends with *, schema: {type: string}}
        - {name: component, in: query, schema: {type: string}}
        - {name: projectId, in: query, schema: {type: string}}
        - {name: stageRunId, in: query, schema: {type: string}}
        - {name: requestId, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Newest-first application logs
          content:
            application/json:
              schema:
                type: object
                required: [logs, nextBefore, postgresEnabled]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppLog'
                  nextBefore:
                    type: [string, 'null']
                  postgresEnabled:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Log storage is not configured (LOG_STORE_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/providers:
    get:
      tags: [models]
      summary: Configured model providers (no secrets)
      responses:
        '200':
          description: Providers with credential presence and model counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: {$ref: '#/components/schemas/ModelProvider'}
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/models:
    get:
      tags: [models]
      summary: Static model catalogue
      parameters:
        - {name: provider, in: query, schema: {type: string}}
      responses:
        '200':
          description: Catalogue entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items: {$ref: '#/components/schemas/ModelEntry'}
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /api/models/providers/{id}/discover:
    post:
      tags: [models]
      summary: Discover and store a provider's models
      description: Requires the bearer token, or a loopback client when no token is configured.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  discovery:
                    type: object
                    properties:
                      provider: {type: string}
                      discovered: {type: integer}
                      models:
                        type: array
                        items: {$ref: '#/components/schemas/ModelEntry'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: PROVIDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: MODEL_AUTH / MODEL_NETWORK / MODEL_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/providers/{id}/health:
    post:
      tags: [models]
      summary: Probe a provider within a deadline
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Provider health
          content:
            application/json:
              schema:
                type: object
                properties:
                  health: {$ref: '#/components/schemas/ProviderHealth'}
        '404':
          description: PROVIDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/models:
    get:
      tags: [models]
      summary: Global model target and its source
      responses:
        '200':
          description: Resolved target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTargetView'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [models]
      summary: Validate and persist the global target
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelTarget'}
      responses:
        '200':
          description: Updated target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTargetView'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [models]
      summary: Remove the stored target and fall back to the environment
      responses:
        '200':
          description: Resolved target after clearing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelTargetView'

  /api/settings/logging:
    get:
      tags: [logs]
      summary: Read logging settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingSettingsResponse'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    patch:
      tags: [logs]
      summary: Update logging settings (applied live and persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggingSettingsPatch'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: POSTGRES_UNAVAILABLE — no database configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/usage:
    get:
      tags: [models]
      summary: Factory-wide token usage and cost
      description: Admin only (it spans every project). Reads stored harness usage events; independent of the model catalogue. Cost is the value recorded when each event was written. Days are UTC.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}, description: Digits only}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Usage report
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage: {$ref: '#/components/schemas/FactoryUsage'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: WORKSPACE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/test:
    post:
      tags: [models]
      summary: Bounded completion through the real routing path
      description: Requires the bearer token, or a loopback client when no token is configured. Uses the global target and its fallback chain.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: {type: string, maxLength: 2000}
                maxTokens: {type: integer, minimum: 1, maximum: 256, default: 32}
                timeoutMs: {type: integer, minimum: 1000, maximum: 300000, default: 60000}
      responses:
        '200':
          description: Result and every attempt made
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: {$ref: '#/components/schemas/ModelTestResult'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: MODEL_CONTENT_FILTER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: MODEL_UNAVAILABLE, MODEL_AUTH, MODEL_NETWORK, MODEL_OVERLOADED, ...
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: MODEL_UNCONFIGURED or MODELS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: MODEL_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/models/price:
    put:
      tags: [models]
      summary: Set a model price (USD per million tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: {type: string}
                model: {type: string}
                input: {type: number, minimum: 0, maximum: 100000}
                output: {type: number, minimum: 0, maximum: 100000}
                cacheRead: {type: number, minimum: 0, maximum: 100000}
                cacheWrite: {type: number, minimum: 0, maximum: 100000}
      responses:
        '200':
          description: The updated catalogue entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {$ref: '#/components/schemas/ModelEntry'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: PROVIDER_NOT_FOUND or MODEL_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/models/providers/{id}/reset:
    post:
      tags: [models]
      summary: Close a provider's circuit breaker
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Whether a breaker existed and was reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: {type: string}
                  reset: {type: boolean}
        '404':
          description: PROVIDER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/models:
    get:
      tags: [models]
      summary: Applied model runtime status
      description: Requires the bearer token, or a loopback client when no token is configured.
      responses:
        '200':
          description: What the harness runs will use
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: object
                    properties:
                      applied: {type: boolean}
                      provider: {type: [string, 'null']}
                      model: {type: [string, 'null']}
                      source: {type: [string, 'null'], enum: [settings, environment, unconfigured, null]}
                      patchPath: {type: [string, 'null']}
                      warnings:
                        type: array
                        items: {type: string}
                      lastError: {type: [string, 'null']}
                      providers:
                        type: array
                        items: {$ref: '#/components/schemas/ProviderBreaker'}
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: MODELS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/observability:
    get:
      tags: [stats]
      summary: Observability provider health
      description: Requires the bearer token, or a loopback client when no token is configured.
      responses:
        '200':
          description: Provider health and cache statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  observability:
                    $ref: '#/components/schemas/ObservabilityHealth'
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: OBSERVABILITY_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/logging:
    get:
      tags: [logs]
      summary: Logging pipeline health and effective configuration
      description: Requires the bearer token, or a loopback client when no token is configured.
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  logging:
                    type: object
                    additionalProperties: true
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/logging/level:
    put:
      tags: [logs]
      summary: Temporary or runtime log level change
      description: >-
        Global level with optional ttlSeconds auto-revert, or a per-component
        override (no TTL). level null clears a component override or returns the
        global level to its configured value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  oneOf:
                    - $ref: '#/components/schemas/LogLevel'
                    - type: 'null'
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                component:
                  type: string
      responses:
        '200':
          description: Effective levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: ADMIN_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/observability:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [observability]
      summary: Phoenix trace summary for a project
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        '200':
          description: Project observability summary
          content:
            application/json:
              schema:
                type: object
                required: [observability]
                properties:
                  observability:
                    $ref: '#/components/schemas/ObservabilitySummary'
        '503':
          description: Phoenix integration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/index:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [retrieval]
      summary: Index project documents into pgvector
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Index result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexProjectResult'
        '503':
          description: Semantic indexing is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/search:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [retrieval]
      summary: Search project chunks semantically
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
        - name: sourceType
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [query, results]
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChunkSearchResult'
        '503':
          description: Semantic search is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/stages/{stage}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Stage'
    get:
      tags: [stage-runs]
      summary: List stage runs
      responses:
        '200':
          description: Runs, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageRun'
        '501':
          description: Stage runtime is not implemented for this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [stage-runs]
      summary: Create a planning stage run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                brief:
                  type: string
                  description: High-level business idea and stakeholder goals for the run.
      responses:
        '201':
          description: Created run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: '#/components/schemas/StageRunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          description: Stage runtime is not implemented for this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stage-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [stage-runs]
      summary: Get a stage run with reviews and documents
      responses:
        '200':
          description: Stage run
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: '#/components/schemas/StageRunDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stage-runs/{runId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [stage-runs]
      summary: List review decisions
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [reviews]
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageReview'

  /api/stage-runs/{runId}/gate:
    post:
      tags: [stage-runs]
      summary: Answer a review gate (apply its findings or accept the draft)
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [apply, accept]}
      responses:
        '200':
          description: The run after applying the answer (it may pause at another gate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: {$ref: '#/components/schemas/StageRunDetail'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: STAGE_RUN_NOT_AT_REVIEW_GATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/stages:
    get:
      tags: [stage-runs]
      summary: Factory defaults for every stage
      responses:
        '200':
          description: Per-stage defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: object
                    additionalProperties: {type: object, additionalProperties: true}
                    description: Keyed by stage; stages without a runtime are empty objects.
        '503':
          description: STAGE_SETTINGS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/stages/{stage}:
    get:
      tags: [stage-runs]
      summary: Factory default for one stage
      parameters:
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      responses:
        '200':
          description: The stage default
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [stage-runs]
      summary: Update a stage Factory default (alias of PATCH)
