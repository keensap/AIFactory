          content:
            application/json:
              schema:
                type: object
                properties:
                  stageDefaults: {$ref: '#/components/schemas/PlanningStageSettings'}
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags: [stage-runs]
      summary: Update Factory defaults
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanningStageSettings'}
      responses:
        '200':
          description: Updated defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  stageDefaults: {$ref: '#/components/schemas/PlanningStageSettings'}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/agents:
