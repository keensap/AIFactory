      responses:
        '200':
          description: Updated default
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          description: STAGE_SETTINGS_NOT_IMPLEMENTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [stage-runs]
      summary: Update a stage Factory default
      parameters:
        - {name: stage, in: path, required: true, schema: {$ref: '#/components/schemas/ProjectStage'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Updated default
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: {$ref: '#/components/schemas/ProjectStage'}
                  settings: {type: object, additionalProperties: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          description: STAGE_SETTINGS_NOT_IMPLEMENTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/stage-defaults:
    get:
      tags: [stage-runs]
      summary: Factory defaults for planning-stage review settings
      deprecated: true
      responses:
        '200':
          description: Defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  stageDefaults: {$ref: '#/components/schemas/PlanningStageSettings'}
        '503':
          description: STAGE_SETTINGS_NOT_CONFIGURED
