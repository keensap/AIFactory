<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="AI Factory chat — a projects-first workspace for the AI Factory Chat API."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Factory · Chat</title>
    <script>
      // Paint the correct theme before React mounts so there is no light flash.
      ;(() => {
        try {
          const raw = localStorage.getItem('aifactory.chat-web.theme.v1')
          let stored = raw
          try {
            const parsed = JSON.parse(raw ?? 'null')
            if (typeof parsed === 'string') stored = parsed
          } catch {
            // Older versions stored the raw value; keep reading it.
          }
          const preference = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'system'
          const dark = preference === 'dark'
            || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
